<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; touch-action: none; user-select: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .cell-short { outline: 2px dashed #c0392b; outline-offset: -2px; }

    /* 色板 + 库房库存 */
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch-wrap { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; position: relative; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .swatch.short { border-color: #c0392b; box-shadow: 0 0 0 2px rgba(192, 57, 43, .35); }
    .swatch.short::after { content: "缺线"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #c0392b; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
    .stock-label { margin: 0; display: flex; align-items: center; gap: 4px; font-size: 11px; text-align: center; justify-content: center; }
    .stock-label input { padding: 3px 4px; font-size: 11px; text-align: center; }

    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; align-items: center; }
    .stat-short { background: #fbeae7; border-radius: 4px; padding: 6px 4px; }
    .dot-color { display: inline-block; width: 14px; height: 14px; border: 1px solid rgba(0,0,0,.15); vertical-align: -2px; }
    .tag-short { color: #c0392b; font-weight: 800; font-size: 12px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .saved { color: #4a7a4e; font-size: 13px; }

    /* 方案栏 */
    .scheme-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
    .scheme-row button { padding: 8px 10px; font-size: 13px; }
    #saveState { font-size: 13px; white-space: nowrap; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，多套方案并存，统计色线用量并核对库房库存。</div></div>
    <div class="toolbar">
      <button id="saveBtn">保存方案</button>
      <button id="exportBtn" class="secondary">导出JSON</button>
      <span id="saveState" class="saved"></span>
    </div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>方案库</h2>
      <div class="scheme-row">
        <select id="schemeSelect"></select>
        <button id="addSchemeBtn" type="button">新建</button>
        <button id="renameBtn" type="button" class="secondary">改名</button>
        <button id="deleteSchemeBtn" type="button" class="secondary">删除</button>
      </div>
      <label>当前方案名称</label><input id="schemeName" type="text">

      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>

      <h2>色线库（库存可改）</h2>
      <div class="palette" id="palette"></div>

      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <h2>用色统计（用量 / 库存）</h2>
      <div class="stats" id="stats"></div>
      <h2>缺线格计数</h2>
      <p id="missingSummary"></p>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <!-- 三份独立业务源码：画布数据 / 方案读写 / 页面操作 -->
  <script src="js/canvas-data.js"></script>
  <script src="js/scheme-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
