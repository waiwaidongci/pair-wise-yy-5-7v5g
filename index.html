<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    h2:first-child { margin-top: 4px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { position: relative; aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .swatch.short { border-color: #a03a2e; box-shadow: inset 0 0 0 2px rgba(160, 58, 46, .45); }
    .swatch .badge { position: absolute; right: -7px; top: -7px; background: #a03a2e; color: #fff; font-size: 10px; font-style: normal; font-weight: 800; border-radius: 9px; padding: 1px 5px; }
    .blocks { display: grid; gap: 8px; }
    .blocks button.active { background: #8d3e37; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .stat .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); margin-right: 6px; vertical-align: -2px; }
    .stat em { font-style: normal; color: #9a8d7f; font-size: 12px; margin-left: 6px; }
    .stat .short-num { color: #a03a2e; font-weight: 800; margin-left: 6px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toolbar:has(input) { grid-template-columns: 1fr auto; align-items: stretch; }
    .stock-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
    .stock-row .chip { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); flex: none; }
    .stock-row span { flex: 1; }
    .stock-row input { width: 86px; flex: none; padding: 6px; }
    #blocked ul { margin: 6px 0 0; padding-left: 18px; }
    #blocked li { margin: 4px 0; font-size: 13px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .ok { color: #355b38; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>多套方案并行试色：网格、色线与用量按方案保存，库房缺线自动阻断排产。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>方案</h2>
      <label>切换方案</label>
      <select id="schemeSelect"></select>
      <label>新方案名称（可留空）</label>
      <div class="toolbar">
        <input id="newSchemeName" placeholder="留空自动命名">
        <button id="newSchemeBtn">新建</button>
      </div>
      <button id="delSchemeBtn" class="secondary" style="width:100%;margin-top:8px">删除当前方案</button>

      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>

      <h2>色线库</h2>
      <div class="palette" id="palette"></div>

      <h2>库房库存（格，留空表示不限）</h2>
      <div id="stock"></div>

      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <h2>排产阻断</h2>
      <div id="blocked"></div>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <!-- 三份独立业务源码：画布数据 / 方案读写 / 页面操作（普通脚本，可直接双击打开本页） -->
  <script src="js/canvas-data.js"></script>
  <script src="js/scheme-store.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
